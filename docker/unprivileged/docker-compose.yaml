services:
  db:
    # We recommend the mariadb image
    image: mariadb:11.4
    # If you want to use MySQL, uncomment the following line (and comment the one above)
    #image: mysql:8.0.37
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=mosparo_root_pw
      - MYSQL_DATABASE=mosparo
      - MYSQL_USER=mosparo
      - MYSQL_PASSWORD=mosparo_password
    expose:
      - 3306
      - 33060
  mosparo_web:
    image: mosparo/mosparo-unprivileged:latest-alpine
    #image: mosparo/mosparo-unprivileged:latest # We recommend using the Alpine-based image, but you can also use the Debian-based one.
    ports:
      # Only reachable from the host itself (e.g. for a reverse proxy running on the host).
      # Docker bypasses host firewalls like ufw, so binding to all interfaces would expose mosparo directly.
      # If your reverse proxy runs on another machine, bind to the LAN IP instead, e.g. 192.168.1.10:8080:80.
      # If your reverse proxy runs as a container in the same Docker network, you can remove the ports section.
      - 127.0.0.1:8080:8080
    restart: always
    environment:
      - MOSPARO_RUN_NGINX=1
      - MOSPARO_RUN_PHP_FPM=1
      - MOSPARO_CONFIG_FILE_PATH=/mosparo-config/env.mosparo.php
      #- MOSPARO_CLEANUP_GRACE_PERIOD_ENABLED=1
    volumes:
      - mosparo_config:/mosparo-config
      - mosparo_public_resources:/mosparo/public/resources
      - mosparo_var:/mosparo/var
volumes:
  db_data:
  mosparo_config:
  mosparo_public_resources:
  mosparo_var: