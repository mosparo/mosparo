name: Build mosparo Docker images

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version (for example, v1.2.3)'
        required: true
  release:
    types: [ published ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: [standard, unprivileged]
    env:
      tagSuffix: ${{ matrix.type == 'unprivileged' && '-unprivileged' || '' }}
      
    steps:
      - name: Prepare environment variables
        id: prep
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          echo "MOSPARO_VERSION=$VERSION" >> $GITHUB_ENV
          
          if [[ "$VERSION" == *"-beta."* ]]; then
            echo "MOSPARO_CHANNEL=beta" >> $GITHUB_ENV
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            echo "MOSPARO_CHANNEL=stable" >> $GITHUB_ENV
            echo "is_stable=true" >> $GITHUB_OUTPUT
          fi
    
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Define Docker meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: "mosparo/mosparo${{ env.tagSuffix }}"
          tags: |
            type=raw,value=${{ env.MOSPARO_VERSION }}
            type=raw,value=latest,enable=${{ steps.prep.outputs.is_stable }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "mosparo/cloud-builder"
          install: true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm/v7,linux/386,linux/amd64,linux/arm/v5,linux/arm64/v8
          context: "docker/${{ matrix.type }}/"
          tags: ${{ steps.meta.outputs.tags }}
          pull: true
          build-args: |
            MOSPARO_VERSION=${{ env.MOSPARO_VERSION }}
            MOSPARO_CHANNEL=${{ env.MOSPARO_CHANNEL }}
          outputs: 'type=registry'
