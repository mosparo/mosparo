            $enabled: '%env(default:oidc_client_false:oidc0_enabled)%'
            $alias: '%env(default:oidc_client_null:oidc0_alias)%'
            $name: '%env(default:oidc_client_null:oidc0_name)%'
            $wellKnownUrl: '%env(default:oidc_client_null:oidc0_well_known_url)%'
            $clientId: '%env(default:oidc_client_null:oidc0_client_id)%'
            $clientSecret: '%env(default:oidc_client_null:oidc0_client_secret)%'
            $redirectRoute: '%env(default:oidc_client_null:oidc0_redirect_route)%'
            $iconUrl: '%env(default:oidc_client_null:oidc0_icon_url)%'
            $assumeEmailVerified: '%env(default:oidc_client_null:oidc0_assume_email_verified)%'
            $enableRetrieveUserInfo: '%env(default:oidc_client_null:oidc0_enable_retrieve_user_info)%'
            $additionalScopes: '%env(json:default:oidc_client_null:oidc0_additional_scopes)%'

