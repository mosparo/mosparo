settings:
  mosparoName:
    colonNotAllowed: El carácter dos puntos (:) no está permitido en el nombre de la instalación de mosparo.
password:
  request:
    form:
      constraint:
        notBlank: Por favor introduzca su dirección de correo electrónico.
  form:
    constraint:
      notBlank: Por favor introduzca una contraseña.
      length: Su password debe contener por lo menos {{ limit }} carácteres.
      passwordMustMatch: Los campos de contraseña deben coincidir.
tools:
  import:
    importFile:
      correctFile: Por favor, suba un fichero JSON válido.
honeypotField:
  nameHasInvalidCharacter: Por favor utilice sólo letras, números y el carácter guión (-).
administration:
  security:
    backendAccess:
      ownIpNotInAllowList: Su dirección IP no está permitida en la lista de permitidas. Por favor añada su dirección IP a la lista.
securityGuideline:
  dynamicComplexityHigher: La complejidad máxima debe ser mayor o igual que la complejidad normal.
webCronJob:
  webCronJobIntervalAtLeast5Minutes: El intérvalo del trabajo cron de la web debe ser por lo menos 5 minutos o más.
  geoIpRefreshIntervalAtLeast1Day: El intérvalo de refresco de GeoIP2 debe ser al menos de un día o más.
hosts:
  hostContainsProtocol: Este servidor tiene un protocolo. Por favor introduzca el servidor sin el protocolo (por ejemplo, ejemplo.com en vez de https://ejemplo.com).
  hostContainsInvalidCharacter: Este servidor contiene carácteres no válidos. En este campo sólo se permiten, carácteres (a-z), números (0-9), guiones, puntos, dos puntos y el asterisco (*).
